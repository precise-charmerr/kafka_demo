name: Build and Test
'on':
  push: null
  pull_request: null
permissions:
  contents: read
jobs:
  order-service:
    name: Build and Test order-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: order-service/pom.xml
      - name: Build and test
        working-directory: order-service
        run: |
          chmod +x mvnw
          ./mvnw -B verify
  notification-service:
    name: Build and Test notification-service
    runs-on: ubuntu-latest
    services:
      kafka:
        image: 'apache/kafka:4.0.1'
        ports:
          - '9092:9092'
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: notification-service/pom.xml
      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka to accept connections..."
          for i in {1..60}; do
            if (echo > /dev/tcp/localhost/9092) >/dev/null 2>&1; then
              echo "Kafka port is accepting connections"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "Kafka did not become ready in time"
          exit 1
      - name: Build and test
        working-directory: notification-service
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: 'localhost:9092'
        run: |
          chmod +x mvnw
          ./mvnw -B verify
