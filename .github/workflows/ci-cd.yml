
name: CI CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # 1. Read version from VERSION file
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.set_version.outputs.image_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read and validate version
        id: set_version
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v1.0.0"
            exit 1
          fi

          echo "image_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

  # 2. Test order-service
  order-service:
    name: Test Order Service
    runs-on: ubuntu-latest
    needs: version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        working-directory: ./order-service
        run: ./mvnw -B verify

  # 3. Test notification-service with Kafka
  notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest
    needs: version

    services:
      kafka:
        image: apache/kafka:4.0.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka port is available"
              exit 0
            fi
            echo "Waiting for Kafka..."
            sleep 2
          done

          echo "Kafka did not become available"
          exit 1

      - name: Run tests
        working-directory: ./notification-service
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: ./mvnw -B verify

  # 4. Build and publish multi-platform Docker images
  publish:
    name: Build and Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - version
      - order-service
      - notification-service

    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Each job has its own workspace, so build JARs again.
      - name: Package application
        working-directory: ./${{ matrix.service }}
        run: ./mvnw -B -DskipTests package

      # Enable cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish for ARM64 and AMD64
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/precise-charmerr/${{ matrix.service }}:${{ needs.version.outputs.image_version }}

  # 5. Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    needs:
      - version
      - publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes access
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Set application version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Deploying version: $VERSION"

      - name: Deploy namespace
        run: |
          kubectl apply -f k8s/infra/namespace.yaml

      - name: Deploy Kafka
        run: |
          kubectl apply -f k8s/infra/kafka.yaml

      - name: Deploy Order Service
        run: |
          sed "s|\${IMAGE_VERSION}|${IMAGE_VERSION}|g" \
            k8s/apps/order-service.yaml | kubectl apply -f -

      - name: Deploy Notification Service
        run: |
          sed "s|\${IMAGE_VERSION}|${IMAGE_VERSION}|g" \
            k8s/apps/notification-service.yaml | kubectl apply -f -

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/kafka \
            -n kafka-demo \
            --timeout=180s

          kubectl rollout status deployment/order-service \
            -n kafka-demo \
            --timeout=180s

          kubectl rollout status deployment/notification-service \
            -n kafka-demo \
            --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployments -n kafka-demo
          kubectl get pods -n kafka-demo
          kubectl get services -n kafka-demo